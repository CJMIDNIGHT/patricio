<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registro en Patricio: robot educativo para niños y niñas de 4 a 6 años.">
  <title>Patricio | Registro</title>
  <link rel="stylesheet" href="css/styles_generales.css">
  <link rel="stylesheet" href="css/styles_registro.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo_patricio.png" type="image/png">
</head>
<body class="registro-body">

  <!-- ── HEADER ── -->
  <header class="reg-header">
    <a href="index.html" class="reg-back">
      <i class="bi bi-chevron-left"></i> Volver a inicio
    </a>
  </header>

  <!-- ── MAIN ── -->
  <main class="registro-main">

    <!-- Logo centered -->
    <div class="reg-logo-wrap">
      <img src="images/logo_patricio.png" alt="Patricio" class="reg-logo">
    </div>

    <!-- Title -->
    <h1 class="reg-title">Registro</h1>

    <!-- Form card -->
    <div class="reg-form-wrap">

      <!-- ── Datos primarios ── -->
      <div class="reg-section" id="secPrimarios">
        <button class="reg-section__header" onclick="toggleSection('secPrimarios')" type="button">
          <span class="reg-section__title">Datos primarios</span>
          <i class="bi bi-caret-down-fill reg-section__arrow"></i>
        </button>
        <div class="reg-section__body">
          <div class="reg-grid reg-grid--3">
            <div class="reg-field">
              <label for="apellido">* 1er Apellido :</label>
              <input type="text" id="apellido" placeholder="Apellido...">
            </div>
            <div class="reg-field">
              <label for="nombre">* Nombre :</label>
              <input type="text" id="nombre" placeholder="Nombre...">
            </div>
            <div class="reg-field">
              <label for="dni">* DNI/NIE :</label>
              <input type="text" id="dni" placeholder="YxxxxxxxxQ...">
            </div>
          </div>
          <div class="reg-grid reg-grid--1">
            <div class="reg-field">
              <label for="apellido2">2o Apellido :</label>
              <input type="text" id="apellido2" placeholder="Apellido...">
            </div>
          </div>
        </div>
      </div>

      <!-- ── Datos secundarios ── -->
      <div class="reg-section" id="secSecundarios">
        <button class="reg-section__header" onclick="toggleSection('secSecundarios')" type="button">
          <span class="reg-section__title">Datos segundarios</span>
          <i class="bi bi-caret-down-fill reg-section__arrow"></i>
        </button>
        <div class="reg-section__body">
          <div class="reg-grid reg-grid--1">
            <div class="reg-field">
              <label for="direccion">* Dirección :</label>
              <input type="text" id="direccion" placeholder="Calle/Avinguda, Puerta, Piso, Puerta, Codigo postal, Ciudad, País...">
            </div>
          </div>
          <div class="reg-grid reg-grid--2">
            <div class="reg-field">
              <label for="email">* Correo :</label>
              <input type="email" id="email" placeholder="nombre@gmail.com...">
            </div>
            <div class="reg-field">
              <label for="telefono">* Teléfono :</label>
              <input type="tel" id="telefono" placeholder="+34 xxx xxx xxx...">
            </div>
          </div>
        </div>
      </div>

      <!-- ── Datos del usuario ── -->
      <div class="reg-section" id="secUsuario">
        <button class="reg-section__header" onclick="toggleSection('secUsuario')" type="button">
          <span class="reg-section__title">Datos del usuario</span>
          <i class="bi bi-caret-down-fill reg-section__arrow"></i>
        </button>
        <div class="reg-section__body">
          <div class="reg-grid reg-grid--3">
            <div class="reg-field">
              <label for="usuario">* Usuario :</label>
              <input type="text" id="usuario" placeholder="usuario123...">
            </div>
            <div class="reg-field">
              <label for="password1">* Contraseña :</label>
              <input type="password" id="password1" placeholder="Contraseña...">
            </div>
            <div class="reg-field">
              <label for="password2">* Confirma Contraseña :</label>
              <input type="password" id="password2" placeholder="Repite la contraseña...">
            </div>
          </div>
        </div>
      </div>

    </div><!-- /reg-form-wrap -->

    <p id="registroError" class="error-message"></p>

    <!-- Submit -->
    <button class="reg-submit" id="registerBtn">Registrarme</button>

    <!-- Login link -->
    <p class="reg-login-link">
      <a href="login.html" id="loginLink">¿Ya tienes cuenta? ¡Inicia sesión!</a>
    </p>

  </main>

  <!-- ── FOOTER ── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <img src="images/logo_patricio.png" alt="Patricio" class="footer-logo">
      <div class="legal-links">
        <span>©2026 Patricio</span>
        <a href="#">Aviso legal</a>
        <a href="#">Política de cookies</a>
        <a href="politica_privacidad.html">Política de privacidad</a>
        <a href="#">Gestión de Cookies</a>
      </div>
      <button class="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})" aria-label="Volver arriba">
        <i class="bi bi-chevron-up"></i>
      </button>
    </div>
  </footer>

  <script src="js/script_singup_login_logout.js"></script>
  <script>
    function toggleSection(id) {
      const sec = document.getElementById(id);
      sec.classList.toggle('collapsed');
    }

    document.getElementById('registerBtn').addEventListener('click', function () {
      const requiredFields = [
        'nombre', 'apellido', 'email',
        'password1', 'password2',
        'dni', 'direccion', 'telefono', 'usuario'
      ];

      requiredFields.forEach(function (fieldId) {
        const input = document.getElementById(fieldId);
        if (!input) return;
        if (!input.value.trim()) {
          input.classList.add('input-error');
        } else {
          input.classList.remove('input-error');
        }

        input.addEventListener('input', function () {
          if (this.value.trim()) this.classList.remove('input-error');
        });
      });
    });
  </script>
</body>
</html>

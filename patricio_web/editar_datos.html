<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patricio | Editar Datos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles_generales.css">
  <link rel="stylesheet" href="css/styles_admin.css">
  <link rel="stylesheet" href="css/styles_logout.css">
  <link rel="stylesheet" href="css/styles_editar_datos.css">
</head>
<body class="admin-body">

  <!-- ── TOP NAVBAR ── -->
  <header class="admin-navbar">
    <a href="index.html" class="admin-navbar__logo-link">
      <img src="images/logo_patricio.png" alt="Patricio" class="admin-navbar__logo">
    </a>
    <div class="admin-navbar__user">
      <span class="admin-navbar__greeting">Hola, Usuario</span>
      <i class="bi bi-person-circle admin-navbar__avatar"></i>
    </div>
  </header>

  <!-- ── LAYOUT WRAPPER ── -->
  <div class="admin-layout">

    <!-- ── LEFT SIDEBAR ── -->
    <aside class="admin-sidebar" id="adminSidebar">
      <nav class="admin-sidebar__nav">
        <a href="admin.html" class="admin-sidebar__item">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Panel de control</span>
        </a>
        <a href="historico.html" class="admin-sidebar__item">
          <i class="fa fa-gamepad" aria-hidden="true" style="font-size: 28px;"></i>
          <span>Partidos</span>
        </a>
        <a href="incidencias.html" class="admin-sidebar__item">
          <i class="bi bi-bell-fill"></i>
          <span>Notificaciones</span>
        </a>
        <a href="editar_datos.html" class="admin-sidebar__item admin-sidebar__item--active">
          <i class="bi bi-gear-fill"></i>
          <span>Perfil</span>
        </a>
      </nav>
      <button class="admin-sidebar__toggle" id="sidebarToggle" aria-label="Colapsar menú">
        <i class="bi bi-chevron-right"></i>
      </button>
      <!-- Cerrar sesión -->
      <div class="admin-sidebar__logout">
        <button class="admin-sidebar__logout-btn" id="logoutButton">
          <i class="bi bi-box-arrow-left"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <!-- ── MAIN CONTENT ── -->
    <main class="admin-main editar-main">

      <div class="editar-card">
        <div class="editar-card__header">
          <i class="bi bi-person-fill"></i>
          <h2>Información del perfil</h2>
        </div>
        <div class="editar-card__body">
          <form id="editarDatosForm">

            <div class="editar-form-group">
              <label for="popupNombre" class="editar-label">Nombre</label>
              <input id="popupNombre" class="editar-input" placeholder="Nombre" />
            </div>

            <div class="editar-form-group">
              <label for="popupApellido" class="editar-label">Apellido</label>
              <input id="popupApellido" class="editar-input" placeholder="Apellido" />
            </div>

            <div class="editar-form-group">
              <label for="popupCodigoAula" class="editar-label">Código de grupo o aula</label>
              <input id="popupCodigoAula" class="editar-input" placeholder="Código" />
            </div>

            <div class="editar-form-group">
              <label for="popupCorreo" class="editar-label">Correo Electrónico</label>
              <input id="popupCorreo" class="editar-input" type="email" placeholder="Correo Electrónico" />
            </div>

            <div class="editar-form-group">
              <label for="popupTelefono" class="editar-label">Teléfono</label>
              <input id="popupTelefono" class="editar-input" type="tel" placeholder="Teléfono" />
            </div>

            <div class="editar-actions">
              <button type="button" id="guardarDatos" class="editar-btn editar-btn--guardar">
                <i class="bi bi-check-lg"></i> Guardar
              </button>
              <button type="button" id="cancelarEdicion" class="editar-btn editar-btn--cancelar"
                onclick="window.history.back()">
                <i class="bi bi-x-lg"></i> Cancelar
              </button>
            </div>

            <div class="editar-feedback" id="editarFeedback"></div>

          </form>
        </div>
      </div>

    </main>
  </div><!-- /admin-layout -->

  <!-- ── FOOTER ── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <img src="images/logo_patricio.png" alt="Patricio" class="footer-logo">
      <div class="legal-links">
        <span>©2026 Patricio</span>
        <a href="#">Aviso legal</a>
        <a href="#">Política de cookies</a>
        <a href="politica_privacidad.html">Política de privacidad</a>
        <a href="#">Gestión de Cookies</a>
      </div>
      <button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Volver arriba">
        <i class="bi bi-chevron-up"></i>
      </button>
    </div>
  </footer>

  <!-- ── LOGOUT POPUP ── -->
  <div id="logoutPopup" class="popup-overlay" style="display:none;">
    <div class="popup-content">
      <h3>¿Estás seguro de que quieres cerrar sesión?</h3>
      <div class="popup-buttons">
        <button id="confirmLogout" class="btn boton">Sí</button>
        <button id="cancelLogout" class="btn boton">No</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script_singup_login_logout.js"></script>
  <script src="js/script_usuario.js"></script>
  <script>
    // Sidebar toggle
    const sidebar = document.getElementById('adminSidebar');
    document.getElementById('sidebarToggle').addEventListener('click', function () {
      sidebar.classList.toggle('collapsed');
      this.querySelector('i').classList.toggle('bi-chevron-right');
      this.querySelector('i').classList.toggle('bi-chevron-left');
    });

    // Save feedback
    document.getElementById('guardarDatos').addEventListener('click', function () {
      const feedback = document.getElementById('editarFeedback');
      // Hook your actual save logic here (Firebase, API, etc.)
      feedback.textContent = '✅ Datos guardados correctamente.';
      feedback.className = 'editar-feedback editar-feedback--success';
      feedback.style.display = 'block';
      setTimeout(() => { feedback.style.display = 'none'; }, 3000);
    });
  </script>

</body>
</html>
